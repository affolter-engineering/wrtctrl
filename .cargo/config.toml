# cargo-leptos selects the correct target (wasm32 vs host) automatically.
# Do NOT set [build].target here — it would break SSR builds.

[target.wasm32-unknown-unknown]
# wasm-bindgen runner is invoked by cargo-leptos, not directly.

[target.x86_64-unknown-linux-musl]
# Used by `cargo make build-musl` for the SSR binary.
# The active Rust toolchain must include rust-std for this target.
linker = "rust-lld"
