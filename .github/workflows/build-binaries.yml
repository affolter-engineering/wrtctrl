name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Build site assets for CSS embedding
        run: cargo leptos build --release

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        env:
          CARGO_TARGET_DIR: target/cross/${{ matrix.target }}
          WRTCTRL_EMBEDDED_JS: target/site/pkg/wrtctrl.js
          WRTCTRL_EMBEDDED_WASM: target/site/pkg/wrtctrl.wasm
        run: cross build --release --no-default-features --features ssr --bin wrtctrl --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          BIN_NAME=wrtctrl
          TARGET=${{ matrix.target }}
          cp target/cross/${TARGET}/${TARGET}/release/${BIN_NAME} dist/${BIN_NAME}-${TARGET}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtctrl-${{ matrix.target }}
          path: dist/wrtctrl-${{ matrix.target }}
          if-no-files-found: error
